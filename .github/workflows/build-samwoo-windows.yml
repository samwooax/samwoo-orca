name: Prepare SAMWOO-ORCA Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samwoo-windows-release
  cancel-in-progress: false

jobs:
  build-sign-and-draft:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "SAMWOO public releases require a stable semver package version, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release v$version already exists. Bump package.json before rebuilding."
          }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify internal code-signing configuration
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $missing = @('WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD') | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing.Count -gt 0) {
            throw "Configure these repository secrets before building: $($missing -join ', ')"
          }

          $rootHash = (Get-FileHash 'deploy/samwoo-internal-root-ca.cer' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rootHash -ne '1dff110f0759f0c43b630f11ed7ca0430e1683fc7848af1e4b9581ea7b869c0f') {
            throw 'Internal root certificate hash does not match the release policy.'
          }
          $publisherHash = (Get-FileHash 'deploy/samwoo-internal-code-signing.cer' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($publisherHash -ne 'f5a6c3ec726645403edbb7b81cff1e32df817e40936a49ee14aa30c39cfe09ae') {
            throw 'Internal publisher certificate hash does not match the release policy.'
          }

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Install frozen worker builder
        run: python -m pip install uv==0.11.26

      - name: Verify SAMWOO local integrations and installer
        shell: pwsh
        run: |
          pnpm exec vitest run --config config/vitest.config.ts `
            src/main/ipc/register-core-handlers.test.ts `
            src/main/ipc/crash-reporting.test.ts `
            src/main/ipc/messenger-popout.test.ts `
            src/main/ipc/hermes-team-chat-runner.test.ts `
            src/main/ipc/hermes-binary-artifact-store.test.ts `
            src/main/ipc/hermes-team-chat-project-attachment.test.ts `
            src/main/ipc/hermes-excel-artifact-job-registry.test.ts `
            src/main/ipc/hermes-excel-artifact-protocol.test.ts `
            src/main/ipc/hermes-local-document-formats.test.ts `
            src/main/ipc/hermes-local-office-documents.test.ts `
            src/main/ipc/hermes-local-document-protocol.test.ts `
            src/main/ipc/hermes-local-envelope-json-repair.test.ts `
            src/main/ipc/hermes-local-document-worker-operations.test.ts `
            src/main/ipc/hermes-local-document-xlsx-worker-extraction.test.ts `
            src/main/ipc/hermes-local-project-documents.test.ts `
            src/main/ipc/hermes-local-project-tool-loop.test.ts `
            src/main/ipc/hermes-team-chat-attachment-normalization.test.ts `
            src/main/ipc/hermes-team-chat-image-transfer.test.ts `
            src/main/ipc/hermes-team-chat-acp-client.test.ts `
            src/main/ipc/hermes-team-chat-session-registry.test.ts `
            src/main/ipc/hermes-team-chat-app-cleanup.test.ts `
            src/main/ipc/hermes-team-chat-ssh-process.test.ts `
            src/main/ipc/hermes-team-chat-claude-stream.test.ts `
            src/main/ipc/hermes-local-project-files.test.ts `
            src/main/ipc/hermes-local-project-commands.test.ts `
            src/main/ipc/hermes-local-command-approval.test.ts `
            src/main/ipc/hermes-team-chat-device-context.test.ts `
            src/main/ipc/hermes-team-chat-models.test.ts `
            src/main/ipc/hermes-local-project-tool-loop.test.ts `
            src/main/ipc/hermes-team-chat-page.test.ts `
            src/main/ipc/samwoo-workspace-file-sync.test.ts `
            src/main/ipc/samwoo-workspace-assignees.test.ts `
            src/main/ipc/samwoo-workspace-work-items.test.ts `
            src/main/ipc/samwoo-profile-messaging.test.ts `
            src/main/ipc/samwoo-profile-members.test.ts `
            src/main/ipc/samwoo-event-stream-client.test.ts `
            src/main/ipc/samwoo-event-stream-parser.test.ts `
            src/main/ipc/samwoo-hermes-cron-client.test.ts `
            src/main/ipc/samwoo-schedule-results.test.ts `
            src/main/ipc/samwoo-service-http-client.test.ts `
            src/main/window/messenger-popout-window.test.ts `
            src/main/updater-install-flags.test.ts `
            src/renderer/src/components/hermes-team-chat/HermesTeamChatModelControls.test.tsx `
            src/renderer/src/components/hermes-team-chat/hermes-team-chat-composer-options.test.ts `
            src/renderer/src/components/hermes-team-chat/hermes-team-chat-mail-token.test.ts `
            src/renderer/src/components/hermes-team-chat/hermes-team-chat-session-options.test.ts `
            src/renderer/src/components/hermes-team-chat/hermes-team-chat-stored-session.test.ts `
            src/renderer/src/components/hermes-team-chat/use-hermes-team-chat-attachments.test.tsx `
            src/renderer/src/components/native-chat/NativeChatComposerActions.test.tsx `
            src/renderer/src/components/right-sidebar/useFileExplorerHandlers.test.ts `
            src/renderer/src/components/native-chat/NativeChatSessionOptionPickers.test.tsx `
            src/renderer/src/components/SamwooLoginGate.test.tsx `
            src/renderer/src/components/sidebar/create-shared-workspace-with-upload.test.ts `
            src/renderer/src/components/sidebar/MessengerPopoutRoot.test.tsx `
            src/renderer/src/components/sidebar/SidebarNav.test.tsx `
            src/renderer/src/components/sidebar/SidebarToolbar.test.tsx `
            src/renderer/src/components/sidebar/ProfileMessageRow.test.ts `
            src/renderer/src/components/sidebar/ProfileOnlineMembers.test.tsx `
            src/renderer/src/components/tab-bar/BrowserTab.test.tsx `
            src/renderer/src/components/tab-bar/SamwooServerConnectionIndicator.test.tsx `
            src/renderer/src/components/tab-group/tab-drop-zone.test.ts `
            src/renderer/src/components/tab-group/tab-group-panel-split-target.test.ts `
            src/renderer/src/components/sidebar/profile-message-grouping.test.ts `
            src/renderer/src/components/sidebar/profile-message-interaction-admission.test.ts `
            src/renderer/src/components/sidebar/use-profile-message-live-updates.test.ts `
            src/renderer/src/components/sidebar/SharedWorkspaceComments.refresh-order.test.tsx `
            src/renderer/src/components/sidebar/shared-workspace-board-status.test.ts `
            src/renderer/src/components/sidebar/WorkspaceKanbanDrawer.task-status-sync.test.tsx `
            src/renderer/src/components/sidebar/WorkspaceKanbanDrawerHeader.test.tsx `
            src/renderer/src/components/workspace-hub/WorkspaceHubPage.test.tsx `
            src/renderer/src/components/right-sidebar/SamwooSchedulePanel.test.tsx `
            src/renderer/src/components/right-sidebar/samwoo-schedule-day-picker.test.ts `
            src/renderer/src/components/workspace-hub/WorkspaceHubViews.test.tsx `
            src/renderer/src/components/workspace-hub/WorkspaceHubBoardView.test.ts `
            src/renderer/src/components/workspace-hub/WorkspaceAssigneePicker.test.tsx `
            src/renderer/src/components/workspace-hub/SharedWorkspaceWorkItems.test.tsx `
            src/renderer/src/components/workspace-hub/use-workspace-hub-assignees.test.tsx `
            src/renderer/src/components/workspace-hub/use-workspace-hub-board-status-update.test.tsx `
            src/renderer/src/components/workspace-hub/use-workspace-hub-due-date.test.tsx `
            src/renderer/src/components/workspace-hub/workspace-due-date.test.ts `
            src/renderer/src/hooks/useSamwooEventStream.workspace-assignment.test.tsx `
            src/renderer/src/hooks/useUnreadDockBadge.test.ts `
            src/renderer/src/components/status-bar/SamwooAuthStatusSegment.test.tsx `
            src/shared/samwoo-login-identity.test.ts `
            src/shared/samwoo-schedule.test.ts `
            src/renderer/src/lib/samwoo-auth-store.test.ts `
            src/renderer/src/lib/samwoo-schedule-store.test.ts `
            src/renderer/src/lib/samwoo-schedule-runner.test.ts `
            src/renderer/src/lib/start-agent-picker-store.test.ts `
            src/renderer/src/lib/profile-member-display.test.ts `
            src/renderer/src/lib/samwoo-message-inbox-store.test.ts `
            src/renderer/src/lib/samwoo-message-notification-decision.test.ts `
            src/renderer/src/lib/samwoo-message-polling-cadence.test.ts `
            src/renderer/src/lib/samwoo-message-send-queue.test.ts `
            src/renderer/src/lib/samwoo-session-validation.test.ts `
            src/renderer/src/lib/shared-workspace-alias-store.test.ts `
            src/renderer/src/lib/samwoo-workspace-assignment-inbox-store.test.ts `
            src/renderer/src/lib/samwoo-workspace-assignment-notification.test.ts `
            src/renderer/src/lib/worktree-activation.test.ts `
            config/scripts/windows-outbound-ssh-installer-contract.test.mjs `
            config/scripts/electron-builder-samwoo-config.test.mjs `
            config/scripts/excel-artifact-packaging-contract.test.mjs `
            config/scripts/hermes-local-document-packaging.test.mjs `
            config/scripts/hermes-excel-artifact-worker-manifest.test.mjs `
            config/scripts/samwoo-brand-assets.test.mjs `
            config/scripts/samwoo-windows-internal-signing-workflow.test.mjs `
            config/scripts/windows-one-click-integrity-contract.test.mjs `
            config/scripts/windows-one-click-launch-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'deploy/install.template.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'deploy/install.template.ps1 has PowerShell parse errors'
          }

          python -m unittest discover -s server/samwoo-auth -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify bundled local document worker
        run: node config/scripts/hermes-local-document-bundle-smoke.mjs

      - name: Package signed Windows NSIS installer
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SAMWOO_WINDOWS_RELEASE: '1'
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/samwoo-orca-windows-setup.exe')) {
            throw 'electron-builder did not produce dist/samwoo-orca-windows-setup.exe'
          }

      - name: Stage and verify signed release assets
        shell: pwsh
        run: |
          $installerPath = 'dist/samwoo-orca-windows-setup.exe'
          $signature = Get-AuthenticodeSignature -FilePath $installerPath
          # Why: clean runners do not trust the private CA; bind intact signatures to the exact signer.
          if ($signature.Status -notin @('Valid', 'UnknownError', 'NotTrusted')) {
            throw ($signature | Format-List * | Out-String)
          }
          if ($signature.SignerCertificate.Thumbprint -ne '81316CB47930717E9EB6949430BD80C2F4E6166D') {
            throw "Unexpected Windows signer: $($signature.SignerCertificate.Subject)"
          }

          node config/scripts/generate-windows-blockmap.mjs `
            'dist/samwoo-orca-windows-setup.exe' `
            'dist/samwoo-orca-windows-setup.exe.blockmap'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installer = Get-Item 'dist/samwoo-orca-windows-setup.exe'
          $blockmap = Get-Item 'dist/samwoo-orca-windows-setup.exe.blockmap'
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try {
            $sha512 = [System.Security.Cryptography.SHA512]::Create()
            $hash = [Convert]::ToBase64String($sha512.ComputeHash($stream))
          } finally {
            if ($null -ne $sha512) { $sha512.Dispose() }
            $stream.Dispose()
          }

          $latestYml = Get-Content -Path 'dist/latest.yml' -Raw
          $latestYml = [regex]::Replace($latestYml, '(?m)^(\s*)sha512: .+$', {
            param($match)
            "$($match.Groups[1].Value)sha512: $hash"
          })
          $latestYml = $latestYml -replace '(?m)^    size: \d+$', "    size: $($installer.Length)"
          $latestYml = $latestYml -replace '(?m)^    blockMapSize: \d+$', "    blockMapSize: $($blockmap.Length)"
          Set-Content -Path 'dist/latest.yml' -Value $latestYml -NoNewline

          $manifestVersion = node -e "console.log(require('yaml').parse(require('fs').readFileSync('dist/latest.yml', 'utf8')).version)"
          if ($manifestVersion -ne '${{ steps.release.outputs.version }}') {
            throw "latest.yml version $manifestVersion does not match package version ${{ steps.release.outputs.version }}"
          }

      - name: Create draft release and upload signed assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target '${{ github.sha }}' `
            --title "SAMWOO-ORCA $env:RELEASE_TAG" `
            --notes "Signed SAMWOO-ORCA Windows update built from ${{ github.sha }}. Publish this draft only after administrator testing." `
            --draft `
            dist/samwoo-orca-windows-setup.exe `
            dist/samwoo-orca-windows-setup.exe.blockmap `
            dist/latest.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $draft = gh api "repos/$env:GITHUB_REPOSITORY/releases" `
            --jq ".[] | select(.tag_name == `"$env:RELEASE_TAG`") | .draft"
          if ($draft -ne 'true') {
            throw "Release $env:RELEASE_TAG was exposed before administrator approval."
          }

          "Draft release is ready: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
