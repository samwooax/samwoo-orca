name: Prepare SAMWOO-ORCA Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samwoo-windows-release
  cancel-in-progress: false

jobs:
  build-sign-and-draft:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "SAMWOO public releases require a stable semver package version, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release v$version already exists. Bump package.json before rebuilding."
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $missing = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          ) | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }

          if ($missing.Count -gt 0) {
            throw "Configure these repository secrets/variables before building: $($missing -join ', ')"
          }

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Verify SAMWOO local integrations and installer
        shell: pwsh
        run: |
          pnpm exec vitest run --config config/vitest.config.ts `
            src/main/ipc/register-core-handlers.test.ts `
            src/main/ipc/hermes-team-chat-runner.test.ts `
            src/main/ipc/hermes-team-chat-image-transfer.test.ts `
            src/main/ipc/hermes-team-chat-acp-client.test.ts `
            src/main/ipc/hermes-team-chat-claude-stream.test.ts `
            src/main/ipc/hermes-local-project-files.test.ts `
            src/main/ipc/hermes-local-project-commands.test.ts `
            src/main/ipc/hermes-team-chat-device-context.test.ts `
            src/main/ipc/hermes-team-chat-models.test.ts `
            src/renderer/src/components/hermes-team-chat/use-hermes-team-chat-attachments.test.tsx `
            config/scripts/windows-outbound-ssh-installer-contract.test.mjs `
            config/scripts/windows-one-click-launch-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'deploy/install.template.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'deploy/install.template.ps1 has PowerShell parse errors'
          }

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package unsigned Windows NSIS installer
        shell: pwsh
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/samwoo-orca-windows-setup.exe')) {
            throw 'electron-builder did not produce dist/samwoo-orca-windows-setup.exe'
          }

      - name: Upload unsigned installer for SignPath
        id: unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: samwoo-orca-windows-unsigned-${{ steps.release.outputs.tag }}
          path: dist/samwoo-orca-windows-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Submit installer to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-windows

      - name: Stage and verify signed release assets
        shell: pwsh
        run: |
          $signedInstaller = Get-ChildItem -Path signed-windows -Recurse -File -Filter 'samwoo-orca-windows-setup.exe' | Select-Object -First 1
          if ($null -eq $signedInstaller) {
            throw 'Signed Windows installer was not returned by SignPath.'
          }

          $signature = Get-AuthenticodeSignature -FilePath $signedInstaller.FullName
          if ($signature.Status -ne 'Valid') {
            throw ($signature | Format-List * | Out-String)
          }
          if ($signature.SignerCertificate.Subject -notlike '*CN=SignPath Foundation*') {
            throw "Unexpected Windows signer: $($signature.SignerCertificate.Subject)"
          }

          Copy-Item -Path $signedInstaller.FullName -Destination 'dist/samwoo-orca-windows-setup.exe' -Force
          node config/scripts/generate-windows-blockmap.mjs `
            'dist/samwoo-orca-windows-setup.exe' `
            'dist/samwoo-orca-windows-setup.exe.blockmap'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installer = Get-Item 'dist/samwoo-orca-windows-setup.exe'
          $blockmap = Get-Item 'dist/samwoo-orca-windows-setup.exe.blockmap'
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try {
            $sha512 = [System.Security.Cryptography.SHA512]::Create()
            $hash = [Convert]::ToBase64String($sha512.ComputeHash($stream))
          } finally {
            if ($null -ne $sha512) { $sha512.Dispose() }
            $stream.Dispose()
          }

          $latestYml = Get-Content -Path 'dist/latest.yml' -Raw
          $latestYml = [regex]::Replace($latestYml, '(?m)^(\s*)sha512: .+$', {
            param($match)
            "$($match.Groups[1].Value)sha512: $hash"
          })
          $latestYml = $latestYml -replace '(?m)^    size: \d+$', "    size: $($installer.Length)"
          $latestYml = $latestYml -replace '(?m)^    blockMapSize: \d+$', "    blockMapSize: $($blockmap.Length)"
          Set-Content -Path 'dist/latest.yml' -Value $latestYml -NoNewline

          $manifestVersion = node -e "console.log(require('yaml').parse(require('fs').readFileSync('dist/latest.yml', 'utf8')).version)"
          if ($manifestVersion -ne '${{ steps.release.outputs.version }}') {
            throw "latest.yml version $manifestVersion does not match package version ${{ steps.release.outputs.version }}"
          }

      - name: Create draft release and upload signed assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target '${{ github.sha }}' `
            --title "SAMWOO-ORCA $env:RELEASE_TAG" `
            --notes "Signed SAMWOO-ORCA Windows update built from ${{ github.sha }}. Publish this draft only after administrator testing." `
            --draft `
            dist/samwoo-orca-windows-setup.exe `
            dist/samwoo-orca-windows-setup.exe.blockmap `
            dist/latest.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $draft = gh api "repos/$env:GITHUB_REPOSITORY/releases" `
            --jq ".[] | select(.tag_name == `"$env:RELEASE_TAG`") | .draft"
          if ($draft -ne 'true') {
            throw "Release $env:RELEASE_TAG was exposed before administrator approval."
          }

          "Draft release is ready: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
