# SAMWOO-ORCA rebranded Windows installer build.
#
# Based on windows-signing-rehearsal.yml with the SignPath signing steps
# removed: this produces an UNSIGNED NSIS installer as a prerelease asset.
name: Build SAMWOO-ORCA Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Verify SAMWOO local file bridge and installer
        shell: pwsh
        run: |
          pnpm exec vitest run --config config/vitest.config.ts `
            src/main/ipc/register-core-handlers.test.ts `
            src/main/ipc/hermes-team-chat-runner.test.ts `
            src/main/ipc/hermes-team-chat-image-transfer.test.ts `
            src/main/ipc/hermes-team-chat-acp-client.test.ts `
            src/main/ipc/hermes-team-chat-claude-stream.test.ts `
            src/main/ipc/hermes-local-project-files.test.ts `
            src/main/ipc/hermes-team-chat-device-context.test.ts `
            src/main/ipc/hermes-team-chat-models.test.ts `
            src/renderer/src/components/hermes-team-chat/use-hermes-team-chat-attachments.test.tsx `
            config/scripts/windows-outbound-ssh-installer-contract.test.mjs `
            config/scripts/windows-one-click-launch-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'deploy/install.template.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'deploy/install.template.ps1 has PowerShell parse errors'
          }

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package Windows NSIS installer
        shell: pwsh
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/samwoo-orca-windows-setup.exe')) {
            throw 'electron-builder did not produce dist/samwoo-orca-windows-setup.exe'
          }

      - name: Upload installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "samwoo-windows-${{ github.sha }}"
          gh release create $tag `
            --target "${{ github.sha }}" `
            --title "SAMWOO-ORCA Windows ${{ github.sha }}" `
            --notes "Unsigned internal Windows installer built from ${{ github.sha }}." `
            --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag `
            dist/samwoo-orca-windows-setup.exe `
            dist/samwoo-orca-windows-setup.exe.blockmap `
            dist/latest.yml `
            --clobber
